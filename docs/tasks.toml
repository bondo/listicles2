[[task]]
id = "M6-O4"
title = "Adopt Git LFS for screenshot goldens (deferred: only when the revisit trigger fires)"
milestone = "M6"
status = "todo"
assignee = "owner"
risk = "normal"
depends_on = ["M6-O1"]
notes = "DEFERRED, owner decision on #15, comment 6974778901 (2026-11-18): Git LFS is NOT adopted now. Revisit trigger: tracked binaries on main above 50 MB, OR pack growth above 20 MB per month (for example Roborazzi golden churn), OR any single file above 5 MB. Becomes ready once M6-O1 is done (the release key), whether or not the trigger has fired: at release the owner checks the trigger and either adopts LFS (the 3 PRs below) or drops this task. Before that, if the trigger fires earlier, the owner clears the depends_on. Why not now: cloud agents check LFS files out as pointers, the proxy rejects lfs.github.com, LFS auth through the git proxy is unverified, and CI checkouts would spend LFS bandwidth. If adopted: about 3 PRs (.gitattributes for goldens only, no history migrate; CI lfs: true plus a cache; agent git lfs pull in verify), and the owner allows lfs.github.com and sets an LFS budget. Until then the M0.5-29 guard keeps files small (M1-03 goldens: small fixed device size, one golden per state)"
