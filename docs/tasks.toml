# Tally task graph: the single source of truth for tasks and their dependencies.
# Process and field meanings: docs/ORCHESTRATION.md section 4. Check: scripts/tasks.py validate
#
# status:     todo | done | dropped   ("in progress" is not stored: it is a claim in the state issue)
# assignee:   owner | implementer | planner | process | retro
# risk:       normal | high           (high = PLAN 9.1 risk:high: higher effort, max-effort review)
# depends_on: task ids, or "milestone:<M>" = every task of milestone <M> is done or dropped
# ids:        <milestone>-NN for agent tasks, <milestone>-O<n> for owner tasks
# A dropped dependency counts as satisfied. Order within a milestone = priority.
# Mx-FU = the milestone's follow-up burn-down (docs/FOLLOW-UPS.md): every milestone with agent work
#         has one, it depends on all of that work, and validate enforces both.

milestones = ["M0", "M0.5", "M1", "M2", "M3", "M4", "M5", "M6"]

# Human-friendly names (shown by the status picture and status.md). id = an entry of `milestones`; title <= 40 and
# purpose <= 110 characters; every milestone needs one. Derived from docs/PLAN.md section 7; the owner may edit them.

[[milestone]]
id = "M0"
title = "Foundation and process"
purpose = "Gradle skeleton, CI, hooks, review loop and agent setup, proven green on a hello-world app."

[[milestone]]
id = "M0.5"
title = "Product design and guardrails"
purpose = "User stories, app flow, design tokens and the test, lint and review guardrails, signed off by the owner."

[[milestone]]
id = "M1"
title = "Accounts and households"
purpose = "Google and email sign-in, households, invite links, members and ownership, with rules tests."

[[milestone]]
id = "M2"
title = "Inventory lists"
purpose = "Private and shared lists, plain and collection items, real-time sync and offline use, in English and Danish."

[[milestone]]
id = "M3"
title = "Packing rules (domain)"
purpose = "(After v1.) Scaling, per-person templates and merging as property-tested pure Kotlin."

[[milestone]]
id = "M4"
title = "Packing templates and trips"
purpose = "(After v1.) Template and rule editor, create a trip, trip checklist and one-off items."

[[milestone]]
id = "M5"
title = "Barcode scanning"
purpose = "(After v1.) Camera scanning, product lookup with a fallback to manual entry, duplicate warning."

[[milestone]]
id = "M6"
title = "Release"
purpose = "Signed APK on tag as a GitHub Release, and a disabled Play internal-track workflow."

