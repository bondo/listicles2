# Listicles task graph: the single source of truth for tasks and their dependencies.
# Process and field meanings: docs/ORCHESTRATION.md section 4. Check: scripts/tasks.py validate
#
# status:     todo | done | dropped   ("in progress" is not stored: it is a claim in the state issue)
# assignee:   owner | implementer | planner | process | retro
# risk:       normal | high           (high = PLAN 9.1 risk:high: higher effort, max-effort review)
# depends_on: task ids, or "milestone:<M>" = every task of milestone <M> is done or dropped
# ids:        <milestone>-NN for agent tasks, <milestone>-O<n> for owner tasks
# A dropped dependency counts as satisfied. Order within a milestone = priority.
# Mx-FU = the milestone's follow-up burn-down (docs/FOLLOW-UPS.md): every milestone with agent work
#         has one, it depends on all of that work, and validate enforces both.

milestones = ["M0", "M0.5", "M1", "M2", "M3", "M4", "M5", "M6"]

