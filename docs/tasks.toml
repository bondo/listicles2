notes = """Needs LISTICLES_TASK=tooling. Leave status = todo (status-sync sets done after review, ORCHESTRATION 4.4). First merge origin/claude/sleepy-mccarthy-z2paqx into the branch with a merge commit so you edit the current protected files. Waits for M0-04 and M0-05 to be done (reviewed and status-synced) so that fixes from their review don't conflict with it in protected files. Test-first with negative cases (ORCHESTRATION 2.0). Needed changes: \
(1) REVIEW.md:70 and the round-cap line in the root CLAUDE.md (:40): the 4-round cap is per batch (a one-batch PR: per PR), see ORCHESTRATION 6.2; \
(2) agents/prompts/reviewer.md: reviewers never edit or push to the PR branch, they only report findings (severity, file:line, recommendation), \
and may test only in a throwaway branch or worktree that is never pushed to the PR branch and is deleted afterwards; flag code changes lacking tests; \
(3) agents/prompts/orchestrator.md: drop docs/status.md and handoff/orchestrator.md, add the autonomy rules (ORCHESTRATION 1.1), \
the 45-minute check-in, the handover, lock check and takeover protocol (5); agents/prompts/implementer.md: write the failing test first, done-status goes on the tasks ref only (4.4); \
(4) handoff/TEMPLATE.md: refer to owner to-dos by issue number, never restate them; \
(5) hook false positives (seen in this PR's work): the PreToolUse guard blocks harmless commands that merely mention a protected path (a read-only listing of .github, reading REVIEW.md) or contain the word git inside a heredoc \
or quoted string ("could not parse this git command"); fix with a test for each blocked-but-harmless case and each allowed-but-harmful case; \
(6) REVIEW.md severity for missing tests, if the owner confirms the 2.0 rule (relayed by a peer session); \
(7) follow-ups: apply the protected-file list in docs/FOLLOW-UPS.md section 8 (REVIEW.md findings format and cap wording, role prompts, the follow-up issue template, PR template Deferred column)"""

