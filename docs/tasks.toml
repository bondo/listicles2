notes = "Split (R2-08): the household soft delete, the tombstone cleanup and P6 went first as M1-95 (PR 390). Here, PLAN 3.1 Leave and Remove member, whose batches delete invites (Leave at most 8 of the leaver's, Remove at most 6 of the target's: ADR 0002). Leave: !O(uid), the own member doc, in one batch with the invite deletes and the users-doc clear (test: allow that clear). Remove member: O(uid), the target not the owner before or after the batch, the member delete needs getAfter(removed/target).removedAt == request.time; the marker is a create or an overwrite (remove-rejoin-remove allowed), holds only removedAt == request.time (P4), written only by O(uid) while M(target) before and !existsAfter(members/target); the owner gets, lists and deletes markers in a live household too (M1-95's managesMarkers has only the tombstone cleanup). Deny: leave by the owner; removal of the owner, also in one batch with a transfer; a marker by a non-owner, while the target stays a member, with another field or without removedAt; a non-owner member reading, listing or deleting a marker. The member delete keeps ADR 0002's order: Leave before P6, Remove last. The marker-driven list unsharing is M2. The tests drafted before the split are kept for this task in PR 390 comment 7135306110 (not run yet). Acceptance (PR 390 R2-01): Leave and the owner's marker get, list and delete in a live household are new paths of existing allow statements, which fuzz.test.ts's row check cannot see and no fuzz.ts template covers yet (model.ts's header): add a row template for each to fuzz.ts (base case allowed) with its model.ts row, and measure again the mutant finds that fuzz.test.ts notes"

