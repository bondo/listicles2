function esc(s) { return String(s).replace(/[&<>\x22\x27]/g, c => ESC[c]); }
function escDeep(v) {
  if (typeof v === 'string') return esc(v);

}

function sameOriginUrl(value, base, fallback) {
  try {
    const u = new URL(value, base);

  } catch (e) { return fallback; }
}

/* ---------- Building blocks ---------- */
const ic = (n, cls = '') => `<span class="ms ${cls}">${n}</span>`;
const iconBtn = (n, cls = '') => `<span class="icon">${ic(n, cls)}</span>`;
const topbar = (title, { back = false, close = false, actions = '' } = {}) =>
  `<div class="topbar">${back ? iconBtn('arrow_back') : ''}${close ? iconBtn('close') : ''}<div class="title t-titleLarge">${title}</div>${actions}</div>`;
const cb = on => `<span class="cbw"><span class="cb ${on ? 'on' : ''}">${on ? ic('check') : ''}</span></span>`;
const years = (s, it) => [it.y, it.r ? `${s.reReleased} ${it.r}` : null].filter(Boolean).join(' · ');
const itemRow = (s, it) => `<div class="row item">${cb(it.c)}<div class="txt"><div class="t-bodyLarge">${it.n}</div>${
  it.y || it.r ? `<div class="t-bodyMedium var">${years(s, it)}</div>` : ''}</div></div>`;
const listRow = (s, l) => {
  const prog = l.total ? s.of(l.have, l.total) : s.noItems;
  const vis = l.by ? s.sharedBy(l.by) : l.shared ? s.shared : s.private;
  const icn = l.by || l.shared ? 'group' : 'lock';
  return `<div class="row card"><div class="txt"><div class="t-titleMedium">${l.name}</div>
    <div class="t-bodySmall var meta"><span>${prog}</span><span aria-hidden="true">·</span><span class="meta" style="gap:4px">${ic(icn).replace('class="ms ', 'style="font-size:14px" class="ms ')}${vis}</span></div></div>${ic('chevron_right', 'lead')}</div>`;
};
const listsBar = s => topbar(s.lists, { actions: `${iconBtn('group')}<span class="icon"><span class="avatar">S</span></span>` });
const fab = (label, icon = 'add') => `<div class="fab t-labelLarge">${ic(icon)}<span>${label}</span></div>`;
const snack = (text, act) => `<div class="snack t-bodyMedium"><span class="txt">${text}</span>${act ? `<span class="act t-labelLarge">${act}</span>` : ''}</div>`;
const dialog = ({ icon, title, body = '', extra = '', acts }) => `<div class="scrim"></div><div class="dialog">${
  icon ? `<div class="hi">${ic(icon)}</div>` : ''}<div class="hd t-headlineSmall">${title}</div>${
  body ? `<div class="t-bodyMedium var">${body}</div>` : ''}${extra}<div class="acts t-labelLarge">${acts}</div></div>`;
const field = ({ label, value = '', ph = '', state = '', caret = false, trail = '', icon = '' }) =>
  `<div class="field ${state} t-bodyLarge"><span class="lbl t-bodySmall">${label}</span><span>${value || `<span class="ph">${ph}</span>`}${
    caret ? '<span class="caret"></span>' : ''}</span>${trail ? `<span class="trail">${ic(trail)}</span>` : icon ? `<span class="trail" style="color:var(--onSurfaceVariant)">${ic(icon)}</span>` : ''}</div>`;
const support = (t, err) => `<div class="support t-bodySmall ${err ? 'err' : ''}">${t}</div>`;
const offline = (s, n) => `<div class="offline t-bodySmall">${ic('cloud_off')}<span class="txt">${s.offline}</span><span class="pending t-labelMedium">${s.pending(n)}</span></div>`;
const logo = () => `<div class="logo"><svg width="44" height="40" viewBox="0 0 44 40" aria-hidden="true">
  <g stroke="var(--onPrimary)" stroke-width="4" stroke-linecap="round"><path d="M8 6v28M16 6v28M24 6v28M32 6v28"/><path d="M3 30L39 10"/></g></svg></div>`;

const listHead = (s, l, filterOn) => `<div class="head"><div class="meta t-bodyMedium var"><span>${s.of(l.have, l.total)}</span><span>·</span><span class="meta" style="gap:4px">${
  ic('group').replace('class="ms ', 'style="font-size:16px" class="ms ')}${l.by ? s.sharedBy(l.by) : s.shared}</span></div>
  <div class="chipwrap"><span class="chip t-labelLarge ${filterOn ? 'on' : ''}">${filterOn ? ic('check') : ''}${s.showMissing}</span></div></div>`;
const openList = (s, { items = ITEMS, filterOn = false, extraTop = '', overlay = '', fabOn = true, l = LISTS[0] } = {}) => {
  return `${topbar(l.name, { back: true, actions: iconBtn('more_vert') })}${extraTop}${listHead(s, l, filterOn)}
  <div class="scroll">${items.map(it => itemRow(s, it)).join('')}<div class="fade"></div>${fabOn ? fab(s.addItem) : ''}</div>${overlay}`;
};
const sheetItem = (s, { title, name, y, r, yErr = false, rErr = false, focus = '', kbd = false, edit = false, plain = false }) => `<div class="scrim"></div><div class="sheet">
  <div class="handle"></div><div class="t-titleLarge" style="margin-bottom:var(--sp-m)">${title}</div>
  ${field({ label: s.name, value: name, state: focus === 'n' ? 'focus' : '', caret: focus === 'n' })}
  ${plain ? '' : `<div class="two" style="margin-top:var(--sp-s)">
    <div>${field({ label: s.releaseYear, value: y, state: yErr ? 'err' : focus === 'y' ? 'focus' : '', caret: focus === 'y', trail: yErr ? 'error' : '' })}${support(yErr ? s.yearRange : s.optional, yErr)}</div>
    <div>${field({ label: s.reReleaseYear, value: r, state: rErr ? 'err' : focus === 'r' ? 'focus' : '', caret: focus === 'r', trail: rErr ? 'error' : '' })}${support(rErr ? s.yearRange : s.optional, rErr)}</div>
  </div>`}
  ${edit ? `<div class="row" style="padding:var(--sp-xs) 0;gap:var(--sp-m)"><span style="margin-left:var(--sp-m)">${cb(true)}</span><span class="t-bodyLarge">${s.iHaveIt}</span></div>` : ''}
  <div class="acts t-labelLarge">${edit ? `<span class="btn text danger" style="margin-right:auto">${ic('delete')}${s.remove}</span><span class="btn text">${s.cancel}</span><span class="btn filled">${s.save}</span>`
    : `<span class="btn text">${s.done}</span><span class="btn filled">${s.add}</span>`}</div>
  ${kbd ? `<div class="kbd">${['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', ic('backspace')].map(k => `<span>${k}</span>`).join('')}</div>` : ''}
</div>`;

const radio = (on, label, note) => `<div class="row" style="padding:var(--sp-xs) 0;gap:var(--sp-xs);align-items:flex-start"><span class="icon" style="color:var(--${on ? 'primary' : 'onSurfaceVariant'})">${ic(on ? 'radio_button_checked' : 'radio_button_unchecked', on ? 'fill' : '')}</span><div class="txt" style="padding-top:var(--sp-m)"><div class="t-bodyLarge">${label}</div><div class="t-bodySmall var">${note}</div></div></div>`;
const typeChoice = s => `<div class="t-labelLarge var" style="margin-top:var(--sp-l)">${s.listType}</div>${radio(true, s.plainList, s.plainNote)}${radio(false, s.collection, s.collectionNote)}<div class="t-bodySmall var">${s.typeFixed}</div>`;

const dots = n => '\u2022'.repeat(n);
const pw = (label, n, o = {}) => field({ label, value: n ? dots(n) : '', icon: o.trail ? '' : 'visibility', ...o });
const auth = (title, body, inner) => `${topbar(title, { back: true })}<div style="padding:0 var(--sp-l);display:flex;flex-direction:column;gap:var(--sp-s)">${
  body ? `<div class="t-bodyMedium var" style="margin-bottom:var(--sp-s)">${body}</div>` : ''}${inner}</div>`;
const qr = () => { let r = ''; let x = 7;
  for (let i = 0; i < 21; i++) for (let j = 0; j < 21; j++) { x = (x * 1103515245 + 12345) & 0x7fffffff;
    const fin = (a, b) => i >= a && i < a + 7 && j >= b && j < b + 7;
    const inF = fin(0, 0) || fin(0, 14) || fin(14, 0);
    const on = inF ? ((i % 14 === 0 || i % 14 === 6 || j % 14 === 0 || j % 14 === 6 || (i % 14 >= 2 && i % 14 <= 4 && j % 14 >= 2 && j % 14 <= 4))) : (x >> 16) & 1;
    if (on) r += `<rect x="${j}" y="${i}" width="1" height="1"/>`; }
  return `<svg width="148" height="148" viewBox="-1 -1 23 23" style="background:#fff;border-radius:8px;align-self:center"><g fill="#000">${r}</g></svg>`; };
const linkRow = (a, b) => `<div class="t-bodyMedium" style="text-align:center;margin-top:var(--sp-s)">${a}</div>${b ? `<div class="t-bodyMedium" style="text-align:center">${b}</div>` : ''}`;

const signInScreen = (s, msg) => `<div class="center">${logo()}<div class="t-headlineSmall" style="margin-top:var(--sp-l)">Tally</div>

  <div class="t-bodySmall var" style="margin-top:var(--sp-s)">${s.signInNote}</div></div>`;
const msgCard = (icon, text) => `<div class="row card" style="width:100%;margin:var(--sp-s) 0 0;background:var(--errorContainer);color:var(--onErrorContainer);text-align:left">${ic(icon)}<div class="txt t-bodyMedium">${text}</div></div>`;
const hhMembers = (s, menu, plain = false) => `${topbar(s.household, { back: true })}<div class="head"><div class="t-headlineSmall">${HH}</div><div class="t-bodyMedium var">${s.members(3)}</div></div>
  <div class="row"><span class="avatar lg">S</span><div class="txt"><div class="t-bodyLarge">Sam Jensen (${s.you})</div><div class="t-bodyMedium var">${plain ? s.member : s.owner}</div></div></div>
  <div class="row"><span class="avatar lg sec">A</span><div class="txt"><div class="t-bodyLarge">Anna Jensen</div><div class="t-bodyMedium var">${plain ? s.owner : s.member}</div></div>${plain ? '' : iconBtn('more_vert')}</div>
  <div class="row"><span class="avatar lg ter">M</span><div class="txt"><div class="t-bodyLarge">Mikkel</div><div class="t-bodyMedium var">${s.member}</div></div>${plain ? '' : iconBtn('more_vert')}</div>
  ${menu ? `<div class="menu t-bodyLarge" style="top:262px;right:16px"><div class="mi">${ic('shield_person')}<span>${s.makeOwner}</span></div><div class="mi danger">${ic('person_remove')}<span>${s.removeMember}</span></div></div>` : ''}
  <div class="section t-titleMedium">${s.openInvites}</div>
  <div class="row">${ic('link', 'lead')}<div class="txt"><div class="t-bodyLarge">${s.inviteLink}</div><div class="t-bodyMedium var">${s.expiresIn(6)}</div></div><span class="btn text t-labelLarge">${s.revoke}</span></div>
  <div style="padding:var(--sp-s) var(--sp-l)"><span class="btn filled wide t-labelLarge">${ic('share')}${s.invite}</span></div>
  <div style="padding:0 var(--sp-l)"><span class="btn text danger wide t-labelLarge">${plain ? s.leaveHh : s.deleteHh}</span></div>`;
const accountScreen = s => `${topbar(s.account, { back: true })}<div class="row" style="padding:var(--sp-l)"><span class="avatar lg">S</span><div class="txt"><div class="t-titleMedium">Sam Jensen</div><div class="t-bodyMedium var">sam@example.com</div></div></div>

function themeVars(T, theme) {
  const v = [];
  for (const [k, c] of Object.entries(T.color[theme])) v.push(`--${k}:${c}`);
  for (const [k, t] of Object.entries(T.type)) v.push(`--${k}-size:${t.size}px`, `--${k}-lh:${t.lineHeight}px`, `--${k}-w:${t.weight}`);
  for (const [k, n] of Object.entries(T.spacing)) v.push(`--sp-${k}:${n}px`);
  for (const [k, n] of Object.entries(T.shape)) v.push(`--sh-${k}:${n}px`);
  for (const [k, n] of Object.entries(T.size)) v.push(`--sz-${k}:${n}px`);
  return v.join(';');
}
const phone = (T, theme, lang, sc) => `<div class="phone ${theme}" lang="${lang}" style="${themeVars(T, theme)}">
  <div class="status"><span>9:41</span><span>${ic('signal_cellular_alt')} ${ic('wifi')} ${ic('battery_full')}</span></div>
  <div class="body">${sc.f(S[lang])}</div><div class="gesture"></div></div>`;
const shot = (T, sc, theme) => `<section class="shot" id="s${sc.id}-${theme}"><div class="cap"><span class="num">${sc.id}</span><span class="ttl">${sc.t}</span>
  <span class="th">${theme === 'dark' ? 'Dark theme' : 'Light theme'} · draft, not approved</span></div><p class="refs">${sc.refs}</p>
  <div class="pair"><figure>${phone(T, theme, 'en', sc)}<figcaption>English</figcaption></figure><figure>${phone(T, theme, 'da', sc)}<figcaption>Dansk</figcaption></figure></div></section>`;

function lum(h) {
  const c = [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255).map(x => (x <= 0.03928 ? x / 12.92 : ((x + 0.055) / 1.055) ** 2.4));
  return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
}
const ratio = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };

function tokensSheet(T) {
  const panel = th => {
    const C = T.color[th];
    const sw = Object.entries(C).map(([k, c]) => {
      const fg = ratio(c, '#000000') > ratio(c, '#FFFFFF') ? '#000000' : '#FFFFFF';
      return `<div class="sw" style="background:${c};color:${fg}"><b>${k}</b>${c}</div>`;
    }).join('');
    const rows = T.contrastPairs.map(p => {
      const r = ratio(C[p.fg], C[p.bg]);
      return `<tr><td><span style="background:${C[p.bg]};color:${C[p.fg]};padding:1px 6px;border-radius:4px">Aa 12 af 30</span></td><td>${p.fg} on ${p.bg}</td><td>${r.toFixed(2)}</td><td>${r >= p.min ? 'pass' : 'FAIL'} (min ${p.min})</td></tr>`;
    }).join('');
    return `<div class="tpanel" style="background:${C.surface};color:${C.onSurface}"><h2 style="margin-top:0">${th === 'light' ? 'Light' : 'Dark'}</h2>
      <div class="swgrid">${sw}</div><h2>Contrast pairs (WCAG AA)</h2><table class="ttable"><tr><th>Sample</th><th>Pair</th><th>Ratio</th><th>Result</th></tr>${rows}</table></div>`;
  };
  const types = Object.entries(T.type).map(([k, t]) => `<div class="typerow"><span class="k">${k} · ${t.size}/${t.lineHeight} sp · ${t.weight}</span>
    <span style="font-size:${t.size}px;line-height:${t.lineHeight}px;font-weight:${t.weight}">Genudgivelsesår 1985 · Re-release year</span></div>`).join('');
  const sp = Object.entries(T.spacing).map(([k, n]) => `<div class="typerow"><span class="k">spacing.${k} · ${n} dp</span><span class="bar" style="width:${n * 4}px;background:${T.color.light.primary}"></span></div>`).join('');
  const sh = Object.entries(T.shape).map(([k, n]) => `<div style="text-align:center;font-size:12px"><div style="width:72px;height:48px;border-radius:${n}px;background:${T.color.light.primaryContainer};border:1px solid ${T.color.light.outline};margin:0 auto 4px"></div>shape.${k} · ${n} dp</div>`).join('');
  const sz = Object.entries(T.size).map(([k, n]) => `<tr><td>size.${k}</td><td>${n} dp</td></tr>`).join('') + Object.entries(T.motion).map(([k, n]) => `<tr><td>motion.${k}</td><td>${n} ms</td></tr>`).join('');
  return `<section class="tsheet"><h1>Tally design tokens</h1><p class="sub">Read from design/tokens.json · ${T.meta.units} · font: ${T.meta.font} · draft, not approved</p>
    <div class="tcols">${panel('light')}${panel('dark')}</div>
    <div class="tcols"><div style="flex:3"><h2>Type scale (sp)</h2>${types}</div><div style="flex:2"><h2>Spacing (dp)</h2>${sp}
    <h2>Shape (corner radius, dp)</h2><div style="display:flex;gap:16px">${sh}</div><h2>Sizes and motion</h2><table class="ttable">${sz}</table></div></div></section>`;
}

/* ---------- Page ---------- */
/* Text from the URL or an error is shown with textContent, never through innerHTML (scripts/wireframes_safety.py). */
function showText(msg) {
  const p = document.createElement('p');
  p.style.padding = '24px';
  p.textContent = msg;
  document.getElementById('app').replaceChildren(p);
}
function render(T) {
  const app = document.getElementById('app');
  const one = params.get('screen');
  if (one === 'tokens') { app.innerHTML = tokensSheet(T); return; }
  if (one) {
    const sc = SCREENS.find(x => x.id === one);
    const shotTheme = params.get('theme') === 'dark' ? 'dark' : 'light';
    if (sc) { document.documentElement.dataset.theme = shotTheme; app.innerHTML = shot(T, sc, shotTheme); }
    else showText(`No screen ${/^[a-z0-9-]{1,40}$/i.test(one) ? one : '?'}`);
    return;
  }
  let theme = 'light';
  try { theme = storedTheme(localStorage.getItem('tally-wf-theme')); } catch (e) { /* storage may be blocked */ }
  const draw = () => {
    app.innerHTML = `<div class="gallery"><h1>Tally v1 wireframes</h1><p class="intro">Status: owner-approved 2026-11-18 (issue #15 comment 6991804241); T2 text size decided (owner, 2026-11-18, issue #15 comment 6991847257) and screen 32a closed (comment 6992107414); recorded in docs/milestones/M1.md section 6. T1 decided: Petrol palette (owner, 2026-11-17, issue #15 comment 6956773225).</p><p class="intro">Owner-approved (task M0.5-03, M0.5-O1). Each screen is shown in English and Danish.
      Numbers match the review sheet in the pull request. Story ids refer to docs/product/stories.md, OQ ids to its open and decided questions.</p>
      <div class="toolbar"><button data-t="light" aria-pressed="${theme === 'light'}">Light</button><button data-t="dark" aria-pressed="${theme === 'dark'}">Dark</button>
      <button data-t="tokens" aria-pressed="${theme === 'tokens'}">Tokens</button></div>
      ${theme === 'tokens' ? tokensSheet(T) : SCREENS.map(sc => shot(T, sc, theme)).join('')}</div>`;
    document.documentElement.dataset.theme = theme === 'dark' ? 'dark' : 'light';
    app.querySelectorAll('.toolbar button').forEach(b => b.addEventListener('click', () => {
      theme = b.dataset.t;
      try { localStorage.setItem('tally-wf-theme', theme); } catch (e) { /* ignore */ }
      draw();
    }));
  };
  draw();
}

fetch(TOKENS_URL).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(data => render(escDeep(data)))
  .catch(e => showText(`Could not read ${TOKENS_URL} (${e}). Serve the repository root over HTTP.`));
</script>
</body>
