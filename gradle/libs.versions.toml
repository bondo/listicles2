[versions]
agp = "9.5.1"
kotlin = "2.4.21"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
coreKtx = "1.19.1"
lifecycle = "2.10.0"
kotest = "6.2.7"
konsist = "0.18.1"
junit = "6.1.3"
junit4 = "4.13.2"
robolectric = "4.18.1"
# PR 381: KoverExclusionsTest reads class annotations; the version Robolectric 4.18.1 resolves (nothing new to fetch).
asm = "9.11.1"
roborazzi = "1.79.0"
# Issue 213: the android-all jar Robolectric 4.18.1 uses for SDK 37 (robolectric.properties), the app's targetSdk. Bump together;
# RobolectricUnderNetworkBlockTest fails (jar not found, or SDK differs from targetSdk) when they disagree.
robolectricAndroidAll = "17-robolectric-16653203-i7"
androidxTestJunit = "1.3.0"
androidxTestRunner = "1.7.0"
# Espresso 3.5.1 (what Compose test pulls) calls InputManager.getInstance(), gone on SDK 37, so Compose tests fail under Robolectric.
androidxTestEspresso = "3.7.0"
detekt = "1.23.8"
composeRulesDetekt = "0.4.28"
kotlinxCoroutines = "1.11.0"
spotless = "8.11.0"
ktlint = "1.8.0"
kover = "0.9.11"
licensee = "1.14.1"
pitestPlugin = "1.19.0"
pitest = "1.30.2"
# Issue 254 / M1-02: the Firebase BoM pins Auth and Firestore. Dependabot bumps it; the Google Services plugin is M1-30.
firebaseBom = "35.2.0"
# M1-30: the Google Services plugin turns google-services.json (or the generated stand-in, app/build.gradle.kts) into resources.
googleServices = "4.6.0"
hilt = "2.60.1"
ksp = "2.3.14"
# M1-60: Navigation 3 (owner decision, checklist section 3) for the start-up root.
navigation3 = "1.2.2"
# M1-66: Credential Manager, Sign in with Google button flow (checklist section 9); licences in config/licensee (M1-O14).
credentials = "1.6.0"
googleid = "1.2.1"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm", version.ref = "kotlinxCoroutines" }
# M1-67: Task.await() for the Firebase calls in :core:data.
kotlinx-coroutines-play-services = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "kotlinxCoroutines" }
# M1-14: runTest and virtual time for the sign-out timeout (checklist section 5: tests use a TestDispatcher with runTest).
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test-jvm", version.ref = "kotlinxCoroutines" }
compose-rules-detekt = { module = "io.nlopez.compose.rules:detekt", version.ref = "composeRulesDetekt" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-junit4-accessibility = { module = "androidx.compose.ui:ui-test-junit4-accessibility" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidxTestEspresso" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-vintage-engine = { module = "org.junit.vintage:junit-vintage-engine" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
asm = { module = "org.ow2.asm:asm", version.ref = "asm" }
roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "roborazzi" }
robolectric-android-all = { module = "org.robolectric:android-all-instrumented", version.ref = "robolectricAndroidAll" }
kotest-runner = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotest-assertions = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-property = { module = "io.kotest:kotest-property", version.ref = "kotest" }
konsist = { module = "com.lemonappdev:konsist", version.ref = "konsist" }
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-auth = { module = "com.google.firebase:firebase-auth" }
firebase-appcheck = { module = "com.google.firebase:firebase-appcheck" }
firebase-appcheck-debug = { module = "com.google.firebase:firebase-appcheck-debug" }
firebase-appcheck-playintegrity = { module = "com.google.firebase:firebase-appcheck-playintegrity" }
firebase-firestore = { module = "com.google.firebase:firebase-firestore" }
androidx-credentials = { module = "androidx.credentials:credentials", version.ref = "credentials" }
androidx-credentials-play-services-auth = { module = "androidx.credentials:credentials-play-services-auth", version.ref = "credentials" }
googleid = { module = "com.google.android.libraries.identity.googleid:googleid", version.ref = "googleid" }
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
hilt-android-testing = { module = "com.google.dagger:hilt-android-testing", version.ref = "hilt" }
# M1-46: build-logic compiles against the plugins the build applies (compileOnly; the versions above).
android-gradle-api = { module = "com.android.tools.build:gradle-api", version.ref = "agp" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
detekt-gradle-plugin = { group = "io.gitlab.arturbosch.detekt", name = "detekt-gradle-plugin", version.ref = "detekt" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
licensee = { id = "app.cash.licensee", version.ref = "licensee" }
pitest = { id = "info.solidsoft.pitest", version.ref = "pitestPlugin" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
# M1-46: the convention plugins of the included build build-logic/ (no version: they are built with the project).
tally-jvm-library = { id = "tally.jvm.library" }
tally-jvm-testsupport = { id = "tally.jvm.testsupport" }
tally-android-library = { id = "tally.android.library" }
tally-android-application = { id = "tally.android.application" }
tally-dependency-floors = { id = "tally.dependency.floors" }
