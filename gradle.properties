org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Ride out HTTP 429 bursts from Maven Central (see settings.gradle.kts): up to 6 tries per request,
# waiting 2s, 4s, 8s, 16s and 32s in between, before Gradle gives up and disables the repository.
systemProp.org.gradle.internal.repository.max.tentatives=6
systemProp.org.gradle.internal.repository.initial.backoff=2000
