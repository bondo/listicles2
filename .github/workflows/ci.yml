name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  wrapper:
    name: wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4

  static:
    name: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - name: warnings-as-errors gate tests
        run: python3 -I scripts/test_warnings_gate.py
      - name: spotless, detekt (incl. type-resolved on :core:domain), lint
        run: ./gradlew -q --console=plain spotlessCheck detekt :core:domain:detektMain :core:domain:detektTest :app:lintDebug

  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - name: unit tests and coverage
        run: ./gradlew -q --console=plain testDebugUnitTest :core:domain:test koverVerify :app:assembleDebug :app:assembleDebugAndroidTest

  firebase:
    name: firebase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - name: rules tests (emulator, no secrets)
        working-directory: firebase
        run: |
          npm ci --silent
          npm test --silent

  ui:
    name: ui
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: ./gradlew -q --console=plain :app:connectedDebugAndroidTest

  guards:
    name: guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: guards
        env:
          GUARD_BASE: origin/${{ github.base_ref || 'main' }}
          GOLDEN_UPDATE: ${{ contains(github.event.pull_request.labels.*.name, 'golden-update') && '1' || '0' }}
          GUARD_MAX_DIFF: ${{ contains(github.event.pull_request.labels.*.name, 'big-pr') && '1500' || '600' }}
        run: ./scripts/guards.sh
      - name: hook tests
        run: python3 -I -m unittest discover -s scripts/hooks

  tasks:
    name: tasks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: tasks.py tests
        run: python3 -I scripts/test_tasks.py
      - name: issue form tests
        run: python3 -I scripts/test_issue_forms.py
      - name: issue forms validate
        run: python3 -I scripts/issue_forms.py
      - name: collab inbox tests
        run: python3 -I scripts/test_collab_inbox.py
      - name: status renderer and fetch tests
        run: python3 -I scripts/test_status_visual.py
      - name: status publisher tests
        run: python3 -I scripts/test_status_publish.py
      - name: status workflow tests
        run: python3 -I scripts/test_status_workflow.py
      - name: prompt rule tests
        run: python3 -I scripts/test_prompt_rules.py
      - name: agent prompts carry the collaborator rules
        run: python3 -I scripts/prompt_rules.py
      - name: docs/tasks.toml validates
        run: python3 -I scripts/tasks.py validate
      - name: docs check tests
        run: python3 -I scripts/test_docs_check.py
      - name: docs links and paths exist
        run: python3 -I scripts/docs_check.py
      - name: agent_metrics.py tests
        run: python3 -I scripts/test_agent_metrics.py
      - name: docs/agent-metrics.csv is up to date
        run: python3 -I scripts/agent_metrics.py --check

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks (version and checksum pinned; update both by hand)
        run: |
          f=gitleaks_8.28.0_linux_x64.tar.gz
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/$f" -o "$f"
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  $f" | sha256sum -c -
          tar -xzf "$f" gitleaks
          ./gitleaks detect --source . --redact --no-banner
