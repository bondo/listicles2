name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  wrapper:
    name: wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

  static:
    name: static
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # Issue 229 / 216: the Gradle gate self-tests run only when the PR can affect them (always on main).
      # No if: here (check_gradle_repos.py forbids one), so scripts/ci_scope.py decides and fails closed.
      - name: Gradle gate self-tests (warnings-as-errors, JDK release; scripts/ci_scope.py)
        run: python3 -I scripts/ci_scope.py selftests
      - name: gradle wrapper checksum check tests (PR 231)
        run: python3 -I scripts/test_check_gradle_wrapper.py
      - name: gradle wrapper checksum (distributionSha256Sum pinned; PR 231)
        run: python3 -I scripts/check_gradle_wrapper.py
      - name: gitignore keeps secret and key files out (PR 235 R1-04)
        run: python3 -I scripts/test_gitignore_secrets.py
      - name: gradle repos check tests (config and CI wiring)
        run: python3 -I scripts/test_check_gradle_repos.py
      - name: gradle repos (Maven Central mirror first, google() filtered, retries with backoff)
        run: python3 -I scripts/check_gradle_repos.py
      - name: spotless, detekt (incl. type-resolved on :core:domain and :core:testing), lint (licensee gate self-test only when ci_scope says so)
        run: |
          read -ra exclude <<< "$(python3 -I scripts/ci_scope.py gradle-exclude)"
          ./gradlew -q --console=plain spotlessCheck detekt :core:domain:detektMain :core:domain:detektTest :core:testing:detektMain :core:testing:detektTest :app:lintDebug "${exclude[@]}"
      - name: JVM modules use only API 26 or older (M1-37, issue 228)
        run: ./gradlew -q --console=plain checkJavaApiLevel

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: unit tests and coverage
        run: ./gradlew -q --console=plain testDebugUnitTest :core:domain:test koverVerify :app:assembleDebug :app:assembleDebugAndroidTest
      - name: short commit sha for the debug APK artifact name
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: debug APK artifact (push to main only, M1-63)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tally-debug-${{ steps.sha.outputs.short }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error
      - name: coverage impact tests (M1-07)
        run: python3 -I scripts/test_coverage_impact.py
      - name: test impact, uncovered changed lines (M1-07)
        run: |
          ./gradlew -q --console=plain koverXmlReport
          python3 -I scripts/coverage_impact.py --xml build/reports/kover/report.xml --base HEAD^1 >> "$GITHUB_STEP_SUMMARY"
      - name: test-results gate tests (PR 239 R2-02)
        run: python3 -I scripts/test_check_test_results.py

  firebase:
    name: firebase
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with: { distribution: temurin, java-version: 21 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - name: install
        working-directory: firebase
        run: npm ci --ignore-scripts --silent
      - name: typecheck (tsc strict)
        working-directory: firebase
        run: npm run typecheck --silent
      - name: lint (ESLint strictTypeChecked)
        working-directory: firebase
        run: npm run lint --silent
      - name: format (Prettier)
        working-directory: firebase
        run: npm run format:check --silent
      - name: typescript tooling tests
        run: python3 -I scripts/test_firebase_ts.py
      - name: rules tests (emulator, no secrets)
        working-directory: firebase
        run: npm test --silent

  ui:
    name: ui
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - name: install the Firebase CLI (the Auth and Firestore emulators the data-layer tests run against)
        working-directory: firebase
        run: npm ci --ignore-scripts --silent
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          # Gradle's log names no failing instrumented test, only the HTML report on the runner does: print the result XML on failure.
          script: cd firebase && npx --no-install firebase emulators:exec --only auth,firestore --project demo-tally "cd .. && ./gradlew --console=plain :app:connectedDebugAndroidTest :core:data:connectedDebugAndroidTest || (find core/data/build/outputs -name '*.xml' -print -exec head -c 7000 {} \\; ; false)"

  screenshots:
    name: screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: screenshots match the goldens exactly, light and dark, en and da (M1-03)
        run: ./scripts/screenshots.sh verify
      - name: screenshot diffs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshot-diffs
          path: app/build/outputs/roborazzi
          if-no-files-found: ignore
          retention-days: 14

  # M1-33: the release variant with R8 on must still build. No google-services.json in CI, so it gets the demo-tally stand-in, which
  # only this job may allow (-Ptally.allowStandInRelease=true, M1-30). Unsigned, nothing published or uploaded. Frozen by
  # scripts/check_release_smoke.py (EXPECTED_JOB); Baseline and Startup Profiles are M6.
  release-smoke:
    name: release-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: release build with R8 (demo-tally stand-in config, unsigned; the one build that may pass the stand-in flag, M1-33)
        run: ./gradlew -q --console=plain -Ptally.allowStandInRelease=true :app:assembleRelease
      - name: R8 ran (mapping file) and the APK is unsigned (nothing is signed, published or uploaded)
        run: |
          test -s app/build/outputs/mapping/release/mapping.txt
          ls app/build/outputs/apk/release/*-release-unsigned.apk

  guards:
    name: guards
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - name: guards
        env:
          GUARD_BASE: origin/${{ github.base_ref || 'main' }}
          GOLDEN_UPDATE: ${{ contains(github.event.pull_request.labels.*.name, 'golden-update') && '1' || '0' }}
          GUARD_MAX_DIFF: ${{ contains(github.event.pull_request.labels.*.name, 'big-pr') && '1500' || '600' }}
        run: ./scripts/guards.sh
      - name: hook tests (full suite on every PR, eight shards in parallel)
        run: python3 -I scripts/hooks/run_hook_tests.py --jobs 8

  tasks:
    name: tasks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - name: ci scope tests (classification, merge-commit CLI, required checks keep reporting)
        run: python3 -I scripts/test_ci_scope.py
      - name: dependency floors tests (PR 224 R1-02)
        run: python3 -I scripts/test_dependency_floors.py
      - name: no vulnerable dependency version in package-lock.json or verification-metadata.xml (PR 224 R1-02)
        run: python3 -I scripts/dependency_floors.py
      - name: build guards tests (M1-51)
        run: python3 -I scripts/test_check_build_guards.py
      - name: targetSdk floor (M1-51)
        run: python3 -I scripts/check_build_guards.py
      - name: java api level checker tests (M1-37)
        run: python3 -I scripts/test_check_java_api_level.py
      - name: PIT config tests (M1-05)
        run: python3 -I scripts/test_check_pit_config.py
      - name: PIT stays wired on core/domain (M1-05)
        run: python3 -I scripts/check_pit_config.py
      - name: tasks.py tests
        run: python3 -I scripts/test_tasks.py
      - name: issue form tests
        run: python3 -I scripts/test_issue_forms.py
      - name: issue forms validate
        run: python3 -I scripts/issue_forms.py
      - name: collab inbox tests
        run: python3 -I scripts/test_collab_inbox.py
      - name: merge_ready.py tests
        run: python3 -I scripts/test_merge_ready.py
      - name: status renderer and fetch tests
        run: python3 -I scripts/test_status_visual.py
      - name: status detail page tests
        run: python3 -I scripts/test_status_page.py
      - name: status publisher tests
        run: python3 -I scripts/test_status_publish.py
      - name: status graph tests
        run: python3 -I scripts/test_status_graph.py
      - name: status workflow tests
        run: python3 -I scripts/test_status_workflow.py
      - name: prompt rule tests
        run: python3 -I scripts/test_prompt_rules.py
      - name: agent prompts carry the collaborator rules
        run: python3 -I scripts/prompt_rules.py
      - name: docs/tasks.toml validates
        run: python3 -I scripts/tasks.py validate
      - name: owner drift check tests
        run: python3 -I scripts/test_owner_drift_check.py
      - name: owner tasks match GitHub (no closed issue or merged PR on a todo row)
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check_owner_drift.sh
      - name: docs check tests
        run: python3 -I scripts/test_docs_check.py
      - name: docs links and paths exist
        run: python3 -I scripts/docs_check.py
      - name: design tokens tests (Petrol decision, theme-swappable roles)
        run: python3 -I scripts/test_design_tokens.py
      - name: design tokens pass WCAG AA in light and dark
        run: python3 -I scripts/design_tokens.py
      - name: wireframes page safety tests
        run: python3 -I scripts/test_wireframes_safety.py
      - name: wireframes page has no URL or error text in innerHTML
        run: python3 -I scripts/wireframes_safety.py
      - name: screenshot gate tests (M1-03)
        run: python3 -I scripts/test_screenshots.py
      - name: screenshot gate wiring (M1-03)
        run: python3 -I scripts/check_screenshots.py
      - name: ui emulators wiring tests (M1-02)
        run: python3 -I scripts/test_check_ui_emulators.py
      - name: ui job runs the data-layer tests inside the Auth and Firestore emulators (M1-02)
        run: python3 -I scripts/check_ui_emulators.py
      - name: debug APK artifact wiring tests (M1-63)
        run: python3 -I scripts/test_check_debug_apk.py
      - name: debug APK artifact is uploaded on push to main only, with contents read (M1-63)
        run: python3 -I scripts/check_debug_apk.py
      - name: release smoke build wiring tests (M1-33)
        run: python3 -I scripts/test_check_release_smoke.py
      - name: release smoke build with R8 stays wired, and the stand-in flag stays in that job only (M1-33)
        run: python3 -I scripts/check_release_smoke.py
      - name: CI hardening check tests (M1-44)
        run: python3 -I scripts/test_check_ci_hardening.py
      - name: CI hardening (job timeouts, pinned python and node, npm ci --ignore-scripts, gitleaks download, hashed pip lock; M1-44)
        run: python3 -I scripts/check_ci_hardening.py
      - name: agent_metrics.py tests
        run: python3 -I scripts/test_agent_metrics.py
      - name: docs/agent-metrics.csv is up to date
        run: python3 -I scripts/agent_metrics.py --check

  python-lint:
    name: python-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - name: ruff and mypy (versions pinned in scripts/requirements-lint.txt)
        run: pip install -r scripts/requirements-lint.txt
      - name: lint tests (config, wiring, deliberate violations)
        run: python3 -I scripts/test_lint_python.py
      - name: ruff check and mypy on scripts/
        run: ./scripts/lint_python.sh

  workflow-lint:
    name: workflow-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - name: lint tests (deliberate violations must fail; the pinned linters are installed by scripts/install_linters.sh, sha256-checked)
        run: python3 -I scripts/test_lint_workflows.py
      - name: shellcheck (-S warning), actionlint, zizmor (--offline)
        run: ./scripts/lint_workflows.sh

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (version and checksum pinned; update both by hand)
        run: |
          f=gitleaks_8.28.0_linux_x64.tar.gz
          curl -sSfL --retry 5 --proto =https --proto-redir =https "https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/$f" -o "$f"
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  $f" | sha256sum -c -
          tar -xzf "$f" gitleaks
          ./gitleaks git --redact --no-banner .
