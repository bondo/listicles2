name: status

# Renders docs/tasks.toml plus open PRs and labelled issues to status.svg and pushes it to the `status` branch,
# which the README embeds. Tests: scripts/test_status_workflow.py. Owner notes: docs/STATUS.md.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed, labeled, unlabeled]
  issues:
    types: [opened, closed, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: status
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Fork PRs and Dependabot get a read-only token and could not push; skip them. Event text is never read.
    if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: fetch GitHub data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: python3 -I scripts/status_fetch.py --repo "$REPO" --out "$RUNNER_TEMP/input.json"
      - name: render
        run: python3 -I scripts/status_visual.py render --tasks docs/tasks.toml --input "$RUNNER_TEMP/input.json" --svg "$RUNNER_TEMP/status.svg" --json "$RUNNER_TEMP/status.json"
      - name: push to the status branch (plain push, no commit if unchanged)
        run: python3 -I scripts/status_publish.py --svg "$RUNNER_TEMP/status.svg" --json "$RUNNER_TEMP/status.json"
